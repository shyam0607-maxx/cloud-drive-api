name: Build Backend Docker Image

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests
        run: npm test --if-present
      
      - name: Build Docker image
        run: docker build -t cloud-drive-api:${{ github.sha }} .
      
      - name: Push to Docker Registry (if main branch)
        if: github.ref == 'refs/heads/main'
        run: |
          echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
          docker tag cloud-drive-api:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/cloud-drive-api:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/cloud-drive-api:latest
